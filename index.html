<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080c18"><title>Capri Voice AI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#182b47,#080c18 65%);color:#e9faff;font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:640px;margin:auto;padding:28px 18px}header{display:flex;align-items:center;gap:12px;margin-bottom:30px}.logo{font-size:34px;color:#00edff}h1{font-size:25px;margin:0;letter-spacing:1px}small{color:#8a9aaa}.panel{border:1px solid #1e5264;border-radius:20px;background:#101a2bc9;padding:22px;box-shadow:0 12px 45px #0005}label{display:block;color:#66edff;font-weight:700;font-size:13px;margin:18px 0 9px}textarea{width:100%;min-height:165px;resize:vertical;border:1px solid #365568;background:#090f1d;color:white;border-radius:12px;padding:15px;font:inherit}select,input[type=range]{width:100%}select{background:#090f1d;color:white;border:1px solid #365568;border-radius:10px;padding:12px;font:inherit}.actions{margin-top:22px}button,.download{display:block;width:100%;border:0;border-radius:12px;padding:16px;background:#00dce8;color:#06131d;font-size:16px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}audio{width:100%;margin-top:18px}.download{background:#243b52;color:#c8faff;margin-top:10px}#status{min-height:25px;color:#9bb6c7;font-size:14px}.hint{font-size:12px;color:#8195a6;line-height:1.5;margin-top:20px}
</style></head><body><div class="wrap"><header><div class="logo">◈</div><div><h1>CAPRI VOICE AI</h1><small>VOICE SYNTHESIS // PT-BR</small></div></header><main class="panel"><label for="text">TEXTO PARA VOZ</label><textarea id="text" maxlength="1500" placeholder="Digite o que a voz deve dizer...">Ei, você chegou. Bem-vindo à cidade do futuro. Aqui, cada escolha muda o jogo. Então, qual vai ser a sua próxima jogada?</textarea><label for="style">ESTILO DE INTERPRETAÇÃO</label><select id="style"><option value="natural">Natural — voz neural</option><option value="cibernetica">Cibernética — voz neural + efeitos</option></select><label for="speed">VELOCIDADE: <span id="speedValue">0%</span></label><input id="speed" type="range" min="-30" max="30" value="0"><div class="actions"><button id="generate">▶ GERAR VOZ</button></div><p id="status" role="status" aria-live="polite"></p><div id="result" hidden><audio id="player" controls></audio><a id="download" class="download" download="capri-voice.mp3">↓ BAIXAR MP3</a></div></main><p class="hint">Voz sintética original em português brasileiro, com dois modos de comparação: Natural e Cibernética. Requer internet e um servidor ativo. Não é uma cópia da voz de uma personagem ou dubladora.</p></div><script>
const $=id=>document.getElementById(id);let currentUrl=null;$('speed').oninput=()=>{$('speedValue').textContent=$('speed').value+'%'};$('generate').onclick=async()=>{const text=$('text').value.trim();if(!text){$('status').textContent='Digite algum texto.';return}const btn=$('generate');btn.disabled=true;$('status').textContent='Gerando áudio...';$('result').hidden=true;try{const res=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,style:$('style').value,speed:Number($('speed').value)})});if(!res.ok)throw Error('Não foi possível gerar a voz ('+res.status+').');const blob=await res.blob();if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(blob);$('player').src=currentUrl;$('download').href=currentUrl;$('result').hidden=false;$('status').textContent='Áudio pronto!';}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
